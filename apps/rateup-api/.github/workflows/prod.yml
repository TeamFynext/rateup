name: prisma-migrate-prod
on:  
  push:
    paths:
      - prisma/**
    branches:
      - main
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install
        run: npm install
  generate:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install
        run: npm install
      - run: rm -rf node_modules/.prisma
      - name: Generate Prisma Client
        run: npx prisma generate
  migrate:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install
        run: npm install
      - run: rm -rf node_modules/.prisma
      - name: Deploy Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
