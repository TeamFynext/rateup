name: prisma-migrate-prod
on:
  push:
    paths:
      - prisma/**
    branches:
      - main
  workflow_dispatch:
# The token is never used by these jobs; keep it read-only.
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - name: Install
        run: npm ci --ignore-scripts
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # generate never connects; prisma.config.ts only needs a value to parse.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  migrate:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v7
      - name: Setup Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - name: Install
        run: npm ci --ignore-scripts
      - name: Deploy Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
