name: Hourly API Call Survey PUBLISH JOB - Prod

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: {} # Allows manual triggering from the GitHub UI

jobs:
  make-api-call:
    runs-on: ubuntu-latest
    steps:
      - name: Make API call
        run: |
          curl -X GET "https://api.rateup.app/api/public/services/surveyJob"
