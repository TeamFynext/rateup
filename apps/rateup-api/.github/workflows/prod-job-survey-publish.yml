name: Half Hourly API Call Survey PUBLISH JOB - Prod

on:
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch: {} # Allows manual triggering from the GitHub UI

jobs:
  make-api-call:
    runs-on: ubuntu-latest
    steps:
      - name: Make API call
        run: |
          curl -X GET "https://rateup-api-production.up.railway.app/api/public/services/surveyJob"
