# pnpm settings for this single-package repo (pnpm 11+ reads them here, not from package.json).
# Dependencies may only run install/build scripts when listed below.
allowBuilds:
  browser-tabs-lock: true
  core-js: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# What each dependency may do beyond installing; `pnpm approve` writes this.
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/match-sorter-utils":
    skills: true
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
  "@tanstack/react-table":
    skills: true
# Agent skills shipped inside dependencies (`pnpm approve`) are linked into both folders:
# .agents/skills for Codex and other agents, .claude/skills for Claude Code.
skills:
  dirs:
    - .agents/skills
    - .claude/skills
