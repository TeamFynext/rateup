packages:
  - apps/*
  - packages/*
  - tools/*
  # apps/mobile is its own install (hoisted node_modules for Expo): see apps/mobile/pnpm-workspace.yaml.
  - "!apps/mobile"

# One version per shared dependency: packages declare what they use as "catalog:" and the
# version lives here, so an upgrade (TanStack, Tailwind, TypeScript...) is one line.
# `catalogMode: prefer` makes `vp add <pkg>` write "catalog:" when the package is listed here.
catalogMode: prefer
catalog:
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource-variable/instrument-sans": ^5.3.0
  "@hookform/resolvers": ^7.0.2
  "@tabler/icons-react": ^3.50.0
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.4
  "@tanstack/devtools-vite": ^0.8.6
  "@tanstack/react-devtools": ^0.10.14
  "@tanstack/react-query": ^5.105.3
  "@tanstack/react-query-devtools": ^5.105.3
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/react-start": ^1.169.4
  "@tanstack/react-table": ^9.3.1
  "@types/lodash": ^4.17.27
  "@types/node": ^26.6.6
  "@types/qrcode": ^1.5.6
  "@types/react": 19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  axios: ^1.21.0
  bullmq: ^6.6.0
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.2
  dayjs: ^1.11.23
  dotenv: ^18.0.9
  immer: ^11.2.9
  kafkajs: ^2.2.4
  libphonenumber-js: ^1.13.15
  lodash: ^4.18.1
  nitro: ^3.0.261103-rc
  qrcode: ^1.5.4
  react: 19.3.1
  react-dom: 19.3.1
  react-hook-form: ^7.91.0
  # recharts' peer: React 19 elements need react-is 19 (17 does not recognise them).
  react-is: 19.3.1
  recharts: ^3.10.1
  shadcn: ^4.23.0
  sharp: ^0.35.5
  sonner: ^2.0.8
  tailwindcss: ^4.3.4
  tsx: ^4.23.15
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  uuid: ^14.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Dependencies may only run install/build scripts when listed below.
allowBuilds:
  "@ffmpeg-installer/linux-x64": true
  "@prisma/engines": true
  bcrypt: true
  browser-tabs-lock: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# What each dependency may do beyond installing; `pnpm approve` writes this.
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/match-sorter-utils":
    skills: true
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
  "@tanstack/react-table":
    skills: true
  expo-sqlite:
    skills: true
  prisma-json-types-generator:
    skills: true

# Agent skills shipped inside dependencies (`pnpm approve`) are linked into both folders:
# .agents/skills for Codex and other agents, .claude/skills for Claude Code.
skills:
  dirs:
    - .agents/skills
    - .claude/skills
